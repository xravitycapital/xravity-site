backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

site_url: "https://xravity.xyz"
display_url: "https://xravity.xyz"
logo_url: "https://xravity.xyz/favicon.svg"

# ─── Collections ───
collections:
  - name: "blog"
    label: "文章 / Blog Posts"
    label_singular: "文章 / Blog Post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "标题 / Title", name: "title", widget: "string" }
      - { label: "发布日期 / Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "摘要 / Excerpt", name: "excerpt", widget: "text", hint: "显示在文章列表里的短摘要。" }
      - { label: "分类 / Category", name: "category", widget: "string", required: false }
      - { label: "语言 / Language", name: "lang", widget: "select", options: ["en", "zh"], default: "zh" }
      - { label: "草稿 / Draft", name: "draft", widget: "boolean", default: false }
      - { label: "精选 / Featured", name: "featured", widget: "boolean", default: false }
      - { label: "更新日期 / Updated Date", name: "updatedDate", widget: "datetime", format: "YYYY-MM-DD", required: false }
      - { label: "标签 / Tags", name: "tags", widget: "list", default: [] }
      - { label: "封面图 / Cover Image", name: "cover", widget: "image", required: false }
      - { label: "封面描述 / Cover Alt", name: "coverAlt", widget: "string", required: false }
      - { label: "关联资源 / Related Resources", name: "relatedResources", widget: "list", default: [], required: false }
      - { label: "正文 / Body", name: "body", widget: "markdown" }

  - name: "resources"
    label: "资源 / Resources"
    label_singular: "资源 / Resource"
    folder: "src/content/resources"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "标题 / Title", name: "title", widget: "string" }
      - { label: "收录日期 / Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "描述 / Description", name: "description", widget: "text" }
      - { label: "链接 / URL", name: "url", widget: "string" }
      - { label: "分类 / Category", name: "category", widget: "string" }
      - { label: "标签 / Tags", name: "tags", widget: "list", default: [] }
      - { label: "语言 / Language", name: "lang", widget: "select", options: ["en", "zh"], default: "zh" }
      - { label: "精选 / Featured", name: "featured", widget: "boolean", default: false }

  # ── Site Settings (edits src/data/site.json) ──
  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings"
        file: "src/data/site.json"
        fields:
          - label: "Site"
            name: "site"
            widget: "object"
            fields:
              - { label: "Site Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Footer Text", name: "footer", widget: "string" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Tag Line", name: "tag", widget: "string" }
              - { label: "Name (after X)", name: "name", widget: "string" }
              - { label: "Subtitle", name: "sub", widget: "text" }
              - { label: "CTA Text", name: "cta", widget: "string" }
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Paragraph 1 (HTML)", name: "p1", widget: "text" }
              - { label: "Paragraph 2", name: "p2", widget: "text" }
              - { label: "Paragraph 3", name: "p3", widget: "text" }
          - label: "Timeline"
            name: "timeline"
            widget: "list"
            fields:
              - { label: "Period", name: "year", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Organization", name: "org", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - label: "Skills"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Icon (emoji)", name: "icon", widget: "string" }
              - { label: "Skill Name", name: "name", widget: "string" }
              - { label: "Level / Description", name: "level", widget: "string" }
          - label: "Gallery"
            name: "gallery"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "sub", widget: "text" }
              - label: "Photos"
                name: "photos"
                widget: "list"
                fields:
                  - { label: "Image", name: "src", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string" }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "sub", widget: "text" }
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Platform Name", name: "platform", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - { label: "Icon (emoji)", name: "icon", widget: "string" }
          - label: "Custom Sections"
            name: "customSections"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Content (HTML)", name: "content", widget: "text" }
